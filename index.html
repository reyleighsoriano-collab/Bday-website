<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>For My Mahal ❤️</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =========================================
         MAIN WEBSITE APP
    ========================================== -->

    <div id="app">

        <main>

            <section class="hero">

                <p class="small-text">
                    A little something I made for you...
                </p>

                <h1>
                    Happy Birthday,<br>
                    My Mahal ❤️
                </h1>

                <p class="subtitle">
                    11 years of memories, laughter, adventures,
                    and a whole lot of love.
                </p>

                <button onclick="openStory()">
                    Open Our Story ♡
                </button>

            </section>

        </main>

    </div>


    <!-- =========================================
         BACKGROUND MUSIC
    ========================================== -->

    <audio
        id="backgroundMusic"
        loop
        preload="auto"
    >
        <source src="romantic-song.mp3" type="audio/mpeg">
    </audio>


    <!-- =========================================
         MUSIC BUTTON
    ========================================== -->

    <button
        id="musicToggle"
        onclick="toggleMusic()"
        aria-label="Toggle music"
    >
        🎵
    </button>


    <script src="script.js"></script>

</body>
</html>
